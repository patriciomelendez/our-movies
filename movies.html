<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Movies 🎬</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f0f0f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        header {
            background: #141414;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a2a;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .header-title span { color: #e50914; }

        .header-right { display: flex; align-items: center; gap: 12px; }

        .auth-status { font-size: 0.78rem; color: #4CAF50; }

        .lock-btn {
            background: #e50914;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .lock-btn:hover { background: #c20810; }
        .lock-btn.unlocked { background: #166534; }
        .lock-btn.unlocked:hover { background: #14532d; }

        main { max-width: 1400px; margin: 0 auto; padding: 28px 24px; }

        /* Search */
        .search-section { margin-bottom: 28px; }

        .search-wrapper { display: flex; gap: 10px; max-width: 560px; }

        .search-input {
            flex: 1;
            padding: 11px 16px;
            background: #1a1a1a;
            border: 1px solid #2e2e2e;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .search-input:focus { outline: none; border-color: #e50914; }
        .search-input::placeholder { color: #555; }

        .btn {
            padding: 9px 18px;
            border-radius: 9px;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.18s;
        }

        .btn-red { background: #e50914; color: white; }
        .btn-red:hover { background: #c20810; }
        .btn-gray { background: #2a2a2a; color: #ccc; }
        .btn-gray:hover { background: #363636; color: white; }
        .btn-outline { background: transparent; color: #e50914; border: 1px solid #e50914; }
        .btn-outline:hover { background: #e50914; color: white; }

        /* Search dropdown */
        .search-relative { position: relative; max-width: 560px; }

        .search-dropdown {
            position: absolute;
            top: 6px;
            left: 0;
            right: 0;
            background: #1c1c1c;
            border: 1px solid #2e2e2e;
            border-radius: 10px;
            z-index: 300;
            max-height: 380px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid #252525;
            transition: background 0.15s;
        }

        .result-item:hover { background: #242424; }
        .result-item:last-child { border-bottom: none; }

        .result-thumb {
            width: 38px;
            height: 57px;
            object-fit: cover;
            border-radius: 5px;
            background: #2a2a2a;
            flex-shrink: 0;
        }

        .result-info h4 { font-size: 0.88rem; font-weight: 600; }
        .result-info p { font-size: 0.78rem; color: #777; margin-top: 2px; }

        /* Tabs */
        .tabs { display: flex; gap: 2px; border-bottom: 1px solid #222; margin-bottom: 26px; }

        .tab {
            padding: 11px 22px;
            background: transparent;
            border: none;
            color: #666;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .tab.active { color: #e50914; border-bottom-color: #e50914; }
        .tab:hover:not(.active) { color: #bbb; }

        /* Section header */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .section-count { font-size: 0.85rem; color: #555; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        .btn-random {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            padding: 10px 20px;
            border-radius: 9px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn-random:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-random:active { transform: translateY(0); }

        /* Movie Grid */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 22px;
        }

        /* Movie Card */
        .movie-card { cursor: pointer; transition: transform 0.2s; }
        .movie-card:hover { transform: translateY(-5px); }
        .movie-card:hover .card-overlay { opacity: 1; }

        .poster-wrapper {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 2/3;
            background: #1a1a1a;
        }

        .movie-poster { width: 100%; height: 100%; object-fit: cover; display: block; }

        .poster-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: #1a1a1a;
            color: #333;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.72);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 8px;
            padding-bottom: 14px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .ov-btn {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 700;
            backdrop-filter: blur(6px);
            transition: background 0.15s;
        }

        .ov-btn:hover { background: rgba(255,255,255,0.22); }
        .ov-btn.green { background: rgba(76,175,80,0.25); border-color: rgba(76,175,80,0.5); }
        .ov-btn.green:hover { background: rgba(76,175,80,0.45); }
        .ov-btn.red { background: rgba(229,9,20,0.25); border-color: rgba(229,9,20,0.5); }
        .ov-btn.red:hover { background: rgba(229,9,20,0.5); }

        .watched-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #4CAF50;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .highlight-card .poster-wrapper {
            box-shadow: 0 0 0 3px #7c3aed, 0 0 28px rgba(124,58,237,0.5);
        }

        .movie-info { margin-top: 9px; padding: 0 2px; }

        .movie-title {
            font-size: 0.83rem;
            font-weight: 600;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-year { font-size: 0.76rem; color: #666; margin-top: 2px; }

        /* Empty */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 72px 20px;
            color: #444;
        }

        .empty-state .ei { font-size: 3.5rem; margin-bottom: 14px; }
        .empty-state p { font-size: 0.95rem; }

        /* Loading */
        .loading-state {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            padding: 60px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #222;
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: #171717;
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 460px;
            border: 1px solid #2a2a2a;
            position: relative;
        }

        .modal-lg { max-width: 680px; }

        .modal-close {
            position: absolute;
            top: 18px;
            right: 20px;
            background: none;
            border: none;
            color: #555;
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.15s;
        }

        .modal-close:hover { color: #fff; }

        .modal-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 22px; }

        /* Form */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.82rem; color: #888; margin-bottom: 6px; font-weight: 600; }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: #222;
            border: 1px solid #333;
            border-radius: 9px;
            color: white;
            font-size: 0.93rem;
            transition: border-color 0.2s;
        }

        .form-input:focus { outline: none; border-color: #e50914; }

        .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }

        .form-error { color: #e50914; font-size: 0.82rem; margin-top: 8px; display: none; }

        /* Detail modal */
        .detail-body { display: flex; gap: 24px; }

        .detail-poster-wrap {
            width: 150px;
            flex-shrink: 0;
            border-radius: 10px;
            overflow: hidden;
            background: #222;
            aspect-ratio: 2/3;
        }

        .detail-poster-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .detail-poster-wrap .no-poster {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .detail-info { flex: 1; min-width: 0; }
        .detail-title { font-size: 1.3rem; font-weight: 800; line-height: 1.2; margin-bottom: 4px; }
        .detail-year { color: #666; font-size: 0.88rem; margin-bottom: 14px; }

        .detail-overview {
            font-size: 0.875rem;
            line-height: 1.65;
            color: #bbb;
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 18px;
            padding-right: 4px;
        }

        .detail-actions { display: flex; flex-wrap: wrap; gap: 9px; }

        .streaming-section { margin-bottom: 14px; }
        .streaming-label { font-size: 0.72rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 7px; }
        .streaming-providers { display: flex; flex-wrap: wrap; gap: 8px; }
        .provider-chip {
            display: flex; align-items: center; gap: 6px;
            background: #1e1e1e; border: 1px solid #2a2a2a;
            border-radius: 8px; padding: 5px 10px 5px 6px;
            font-size: 0.78rem; color: #ccc;
        }
        .provider-chip img { width: 24px; height: 24px; border-radius: 5px; }

        .trailer-wrap {
            position: relative;
            padding-top: 56.25%;
            margin-top: 22px;
            border-radius: 10px;
            overflow: hidden;
        }

        .trailer-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Add movie preview */
        .add-preview { display: flex; gap: 16px; align-items: flex-start; }
        .add-preview-poster { width: 72px; height: 108px; object-fit: cover; border-radius: 7px; background: #222; flex-shrink: 0; }
        .add-preview-info h3 { font-size: 1rem; font-weight: 700; }
        .add-preview-info p { font-size: 0.82rem; color: #777; margin: 3px 0 10px; }
        .add-preview-info .overview { font-size: 0.82rem; color: #aaa; line-height: 1.5; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            padding: 12px 20px;
            border-radius: 9px;
            font-size: 0.875rem;
            font-weight: 600;
            z-index: 9999;
            animation: toastIn 0.28s ease;
            pointer-events: none;
        }

        .toast-success { background: #14532d; border-left: 3px solid #4CAF50; }
        .toast-error { background: #450a0a; border-left: 3px solid #e50914; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        /* Location filter pills */
        .filter-pills { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-pill {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #2e2e2e;
            background: transparent;
            color: #666;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s;
        }
        .filter-pill:hover { border-color: #555; color: #aaa; }
        .filter-pill.active { background: #e50914; border-color: #e50914; color: white; }

        /* Location badge on card */
        .loc-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 0.7rem;
            background: rgba(0,0,0,0.75);
            border-radius: 4px;
            padding: 2px 5px;
            backdrop-filter: blur(4px);
        }

        /* Location toggle in add modal */
        .loc-toggle {
            flex: 1;
            padding: 8px 6px;
            border-radius: 8px;
            border: 1px solid #333;
            background: transparent;
            color: #666;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }
        .loc-toggle:hover { border-color: #555; color: #aaa; }
        .loc-toggle.loc-active { background: #e50914; border-color: #e50914; color: white; }

        /* RT Score badge */
        .rt-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .rt-badge:hover { opacity: 0.75; }
        .rt-fresh  { background: rgba(229,9,20,0.15); color: #ff6b6b; }
        .rt-rotten { background: rgba(100,100,100,0.15); color: #888; }

        /* Month groups in Watched tab */
        .month-group { margin-bottom: 36px; }
        .month-label {
            font-size: 0.78rem;
            font-weight: 800;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e1e1e;
        }
        .watched-date {
            font-size: 0.72rem;
            color: #555;
            margin-top: 3px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header { padding: 12px 16px; }
            .header-title { font-size: 1.1rem; }
            main { padding: 16px 12px; }
            .search-wrapper { max-width: 100%; }
            .search-relative { max-width: 100%; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
            .btn-random { padding: 9px 14px; font-size: 0.8rem; }
            .section-header { flex-wrap: wrap; gap: 10px; }
        }

        @media (max-width: 540px) {
            .detail-body { flex-direction: column; align-items: center; }
            .detail-poster-wrap { width: 130px; }
            .detail-overview { max-height: 120px; }
            .modal { padding: 20px 16px; }
            .modal-lg { max-height: 90vh; overflow-y: auto; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
            .movie-title { font-size: 0.78rem; }
            /* Hide hover overlay on mobile — use detail modal instead */
            .card-overlay { display: none !important; }
        }

        @media (max-width: 380px) {
            .movie-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">Our <span>Movies</span></div>
    <div class="header-right">
        <span class="auth-status" id="authStatus"></span>
        <button class="lock-btn" id="lockBtn" onclick="handleLockClick()">🔒 Unlock</button>
    </div>
</header>

<main>
    <!-- Search (only when unlocked) -->
    <div class="search-section" id="searchSection" style="display:none">
        <div class="search-wrapper">
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Search for a movie to add..."
                oninput="onSearchInput()"
                autocomplete="off"
            >
            <button class="btn btn-gray" onclick="clearSearch()">Clear</button>
        </div>
        <div class="search-relative">
            <div class="search-dropdown" id="searchDropdown" style="display:none"></div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" id="tab-towatch" onclick="switchTab('towatch')">🎬 Movies</button>
        <button class="tab" id="tab-tvshows" onclick="switchTab('tvshows')">📺 TV Shows</button>
        <button class="tab" id="tab-watched" onclick="switchTab('watched')">✅ Watched</button>
    </div>

    <!-- Movies To Watch -->
    <div id="section-towatch">
        <div class="section-header">
            <span class="section-count" id="count-towatch"></span>
            <button class="btn-random" onclick="pickRandom('movie')">🎲 Pick Random</button>
        </div>
        <div class="filter-pills">
            <button class="filter-pill active" id="pill-any" onclick="setLocationFilter('any')">All</button>
            <button class="filter-pill" id="pill-streaming" onclick="setLocationFilter('streaming')">📺 Streaming</button>
            <button class="filter-pill" id="pill-theater" onclick="setLocationFilter('theater')">🎬 In Theaters</button>
        </div>
        <div class="movie-grid" id="grid-towatch">
            <div class="loading-state"><div class="spinner"></div></div>
        </div>
    </div>

    <!-- TV Shows To Watch -->
    <div id="section-tvshows" style="display:none">
        <div class="section-header">
            <span class="section-count" id="count-tvshows-watch"></span>
            <button class="btn-random" onclick="pickRandom('tv')">🎲 Pick Random</button>
        </div>
        <div class="movie-grid" id="grid-tvshows-towatch">
            <div class="loading-state"><div class="spinner"></div></div>
        </div>
    </div>

    <!-- Watched (all) -->
    <div id="section-watched" style="display:none">
        <div class="section-header">
            <span class="section-count" id="count-watched"></span>
        </div>
        <div id="grid-watched"></div>
    </div>
</main>

<!-- PASSWORD MODAL -->
<div class="modal-overlay" id="authModal" style="display:none">
    <div class="modal">
        <div class="modal-title" id="authModalTitle">Sign In</div>

        <form onsubmit="event.preventDefault();submitAuth()" autocomplete="on">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="authEmail" name="email" placeholder="your@email.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="authPassword" name="password" placeholder="••••••••" autocomplete="current-password">
            </div>

            <div class="form-error" id="authError"></div>

            <div class="form-actions" style="margin-top:8px">
                <button type="submit" class="btn btn-red" id="authSubmitBtn" style="width:100%">Sign In</button>
            </div>
        </form>

        <div style="text-align:center;margin-top:14px">
            <button id="authToggleBtn" style="background:none;border:none;color:#555;font-size:0.82rem;cursor:pointer;text-decoration:underline" onclick="toggleAuthMode()">First time? Create your account</button>
        </div>
    </div>
</div>

<!-- ADD MOVIE MODAL -->
<div class="modal-overlay" id="addModal" style="display:none">
    <div class="modal">
        <button class="modal-close" onclick="closeAddModal()">×</button>
        <div class="modal-title">Add to Watch List?</div>
        <div id="addPreview"></div>
        <div class="form-actions">
            <button class="btn btn-gray" onclick="closeAddModal()">Cancel</button>
            <button class="btn btn-red" id="addConfirmBtn" onclick="confirmAdd()">Add</button>
        </div>
    </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal" style="display:none" onclick="handleDetailBg(event)">
    <div class="modal modal-lg" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeDetail()">×</button>
        <div id="detailBody"></div>
        <div id="trailerSlot"></div>
    </div>
</div>

<script>
// ─────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────
const SUPABASE_URL  = 'https://kiwcyfscjomenhlheqvx.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_2HYE8Vc_p8sc7pe0Y1WHzA_LX336F11';
const TMDB_KEY      = 'b0b8cc130921376671fb86afda7cbe2f';
const TMDB_IMG_BASE = 'https://image.tmdb.org/t/p/w500';
const OMDB_KEY      = 'c2b90204';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let unlocked       = false;
let movies         = [];
let currentTab     = 'towatch';
let pendingMovie   = null;

const ALLOWED_EMAILS = ['patricio.mcon@gmail.com', 'alejandrayabar96@gmail.com'];
const RT_VER = 8; // bump this to force re-fetch of all RT scores

async function init() {
    const { data, error } = await db.from('movies').select('*').order('added_at', { ascending: false });
    if (!error) movies = data || [];

    // Check Supabase auth session (persists automatically across reloads)
    const { data: { session } } = await db.auth.getSession();
    if (session) {
        applyUnlocked(session.user.email);
    }

    // React to sign-in / sign-out events in real time
    db.auth.onAuthStateChange((_event, session) => {
        if (session) applyUnlocked(session.user.email);
        else applyLocked();
    });

    renderMovies();

    // Auto-refresh locations once per day
    const lastRefresh = parseInt(localStorage.getItem('lastLocationRefresh') || '0');
    const oneDayMs = 24 * 60 * 60 * 1000;
    if (Date.now() - lastRefresh > oneDayMs) {
        const needsUpdate = movies.filter(m => m.media_type !== 'tv');
        if (needsUpdate.length) {
            refreshLocations(needsUpdate);
            localStorage.setItem('lastLocationRefresh', Date.now().toString());
        }
    }

    // Re-fetch RT scores if missing or saved by an older version of the logic
    const needsRT = movies.filter(m => m.media_type !== 'tv' && (
        !m.rt_score ||
        parseInt((m.rt_score.split('|')[2] || '0')) < RT_VER
    ));
    if (needsRT.length) refreshRTScores(needsRT);
}

async function submitAuth() {
    const authErr = document.getElementById('authError');
    authErr.style.display = 'none';
    const email = document.getElementById('authEmail').value.trim().toLowerCase();
    const password = document.getElementById('authPassword').value;

    if (!ALLOWED_EMAILS.includes(email)) {
        showErr(authErr, 'This email is not authorized to access this list.');
        return;
    }
    if (!password) { showErr(authErr, 'Please enter your password'); return; }

    if (authMode === 'signup') {
        const { error } = await db.auth.signUp({ email, password });
        if (error) { showErr(authErr, error.message); return; }
        toast('Account created! You\'re now signed in 🎉', 'success');
    } else {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) { showErr(authErr, 'Incorrect email or password'); return; }
    }

    closeAuthModal();
    if (pendingMovie) { showAddModal(pendingMovie); pendingMovie = null; }
}

async function setupBiometric() {
    const btn = document.getElementById('biometricSetupBtn');
    if (!await isBiometricAvailable()) {
        toast('Biometrics not supported on this browser', 'error'); return;
    }
    // If already enabled, disable it
    if (localStorage.getItem('biometricEnabled')) {
        localStorage.removeItem('waCredId');
        localStorage.removeItem('biometricEnabled');
        if (btn) btn.textContent = '🔑 Set up Touch ID / Face ID';
        toast('Biometrics removed', 'success'); return;
    }
    try {
        const cred = await navigator.credentials.create({
            publicKey: {
                challenge: crypto.getRandomValues(new Uint8Array(32)),
                rp: { name: 'Our Movies', id: WA_RP_ID },
                user: {
                    id: new TextEncoder().encode('our-movies-user'),
                    name: 'user',
                    displayName: 'Movie Watcher'
                },
                pubKeyCredParams: [
                    { alg: -7, type: 'public-key' },
                    { alg: -257, type: 'public-key' }
                ],
                authenticatorSelection: {
                    authenticatorAttachment: 'platform',
                    userVerification: 'required',
                    residentKey: 'preferred'
                },
                attestation: 'none',
                timeout: 60000
            }
        });
        localStorage.setItem('waCredId', btoa(String.fromCharCode(...new Uint8Array(cred.rawId))));
        localStorage.setItem('biometricEnabled', '1');
        if (btn) btn.textContent = '❌ Remove Touch ID / Face ID';
        toast('Touch ID / Face ID enabled! ✓', 'success');
    } catch(e) {
        if (e.name !== 'NotAllowedError') toast('Could not enable biometrics', 'error');
    }
}

async function addMovie(m) {
    const { data, error } = await db.from('movies').insert([{
        tmdb_id:     m.tmdb_id,
        title:       m.title,
        year:        m.year,
        poster_path: m.poster_path,
        overview:    m.overview,
        trailer_key: m.trailer_key,
        media_type:  m.media_type || 'movie',
        location:    m.location || 'any',
        rt_score:    m.rt_score || null,
        watched:     false
    }]).select().single();

    if (error) {
        toast(error.code === '23505' ? 'Already in your list!' : 'Failed to add movie', 'error');
        return;
    }
    movies.unshift(data);
    renderMovies();
    toast(`"${m.title}" added!`, 'success');
}

async function toggleWatched(id) {
    const m = movies.find(x => x.id === id);
    if (!m) return;
    const next = !m.watched;
    const watchedAt = next ? new Date().toISOString() : null;
    const { error } = await db.from('movies').update({ watched: next, watched_at: watchedAt }).eq('id', id);
    if (error) { toast('Failed to update', 'error'); return; }
    m.watched = next;
    m.watched_at = watchedAt;
    renderMovies();
    toast(next ? 'Marked as watched!' : 'Moved back to watch list!', 'success');
}

async function removeMovie(id) {
    const m = movies.find(x => x.id === id);
    if (!confirm(`Remove "${m?.title}" from your list?`)) return;
    const { error } = await db.from('movies').delete().eq('id', id);
    if (error) { toast('Failed to remove', 'error'); return; }
    movies = movies.filter(x => x.id !== id);
    renderMovies();
    closeDetail();
    toast('Movie removed', 'success');
}

async function tmdbSearch(q) {
    const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}&language=en-US&page=1`);
    const d = await r.json();
    return d.results || [];
}

async function tmdbTvSearch(q) {
    const r = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}&language=en-US&page=1`);
    const d = await r.json();
    return d.results || [];
}

async function tmdbTrailer(tmdbId, mediaType) {
    try {
        const endpoint = mediaType === 'tv' ? 'tv' : 'movie';
        const r = await fetch(`https://api.themoviedb.org/3/${endpoint}/${tmdbId}/videos?api_key=${TMDB_KEY}&language=en-US`);
        const d = await r.json();
        const t = (d.results || []).find(v => v.type === 'Trailer' && v.site === 'YouTube');
        return t ? t.key : null;
    } catch { return null; }
}

// ─────────────────────────────────────────────
// ROTTEN TOMATOES (OMDb)
// ─────────────────────────────────────────────
async function fetchRTScore(title, year, tmdbId, mediaType) {
    const isTV = mediaType === 'tv';
    try {
        let score = null;
        let omdbTitle = null; // OMDb's canonical title — used for RT slug (more accurate than TMDB)
        const typeParam = isTV ? '&type=series' : '';

        // 1. Try OMDb with year for precise match
        if (year) {
            const r = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(title)}&y=${year}${typeParam}&apikey=${OMDB_KEY}`);
            const d = await r.json();
            if (d.Response === 'True') {
                const rt = (d.Ratings || []).find(x => x.Source === 'Rotten Tomatoes');
                if (rt) { score = rt.Value; omdbTitle = d.Title; }
            }
        }

        // 2. Fallback: OMDb without year
        if (!score) {
            const r2 = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(title)}${typeParam}&apikey=${OMDB_KEY}`);
            const d2 = await r2.json();
            if (d2.Response === 'True') {
                const rt2 = (d2.Ratings || []).find(x => x.Source === 'Rotten Tomatoes');
                if (rt2) { score = rt2.Value; omdbTitle = d2.Title; }
            }
        }

        if (!score) return null;

        // 3. Determine RT slug: unique title → no year, ambiguous → year suffix
        const canonical = omdbTitle || title;
        let slugYr = 0;

        if (year) {
            try {
                const tmdbSearch = isTV
                    ? `https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}`
                    : `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}`;
                const r3 = await fetch(tmdbSearch);
                const d3 = await r3.json();
                const nameKey = isTV ? 'name' : 'title';
                const exactMatches = (d3.results || []).filter(m =>
                    (m[nameKey] || '').toLowerCase() === title.toLowerCase()
                );
                if (exactMatches.length > 1) slugYr = year;
            } catch {}
        }

        // Format: "87%|slugYear|version|OMDb title"
        // slugYear = 0    → direct slug  → /m/title or /tv/title
        // slugYear = YYYY → year suffix  → /m/title_YYYY or /tv/title_YYYY
        // slugYear = -1   → legacy search fallback (kept for backward compat)
        return `${score}|${slugYr}|${RT_VER}|${canonical}`;
    } catch { return null; }
}

// Only re-check the RT slug format (TMDB call only, no OMDb).
// Used when a score already exists but the URL version is outdated.
async function refreshRTSlug(score, title, year, tmdbId, mediaType) {
    const isTV = mediaType === 'tv';
    let slugYr = 0;
    if (year) {
        try {
            const tmdbSearch = isTV
                ? `https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}`
                : `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}`;
            const r = await fetch(tmdbSearch);
            const d = await r.json();
            const nameKey = isTV ? 'name' : 'title';
            const exactMatches = (d.results || []).filter(m =>
                (m[nameKey] || '').toLowerCase() === title.toLowerCase()
            );
            if (exactMatches.length > 1) slugYr = year;
        } catch {}
    }
    return `${score}|${slugYr}|${RT_VER}|${title}`;
}

async function refreshRTScores(list) {
    const ind = Object.assign(document.createElement('div'), {
        id: 'rt-refresh-indicator',
        textContent: `🍅 Updating RT links (0/${list.length})…`
    });
    Object.assign(ind.style, {
        position:'fixed', bottom:'28px', left:'50%', transform:'translateX(-50%)',
        background:'#1a1a1a', border:'1px solid #333', borderRadius:'9px',
        padding:'10px 18px', fontSize:'0.8rem', color:'#888', zIndex:'9998',
        pointerEvents:'none', whiteSpace:'nowrap'
    });
    document.body.appendChild(ind);

    for (let i = 0; i < list.length; i++) {
        const m = list[i];
        ind.textContent = `🍅 Updating RT links (${i+1}/${list.length})…`;

        const existing = parseRT(m.rt_score);
        let newEntry;

        if (existing.score) {
            // Score already saved — only redo the slug/URL check (TMDB only, no OMDb)
            // This preserves scores forever and avoids OMDb rate limits
            const slugTitle = existing.omdbTitle || m.title;
            newEntry = await refreshRTSlug(existing.score, slugTitle, m.year, m.tmdb_id, m.media_type);
        } else {
            // No score yet — full fetch from OMDb + slug determination
            newEntry = await fetchRTScore(m.title, m.year, m.tmdb_id, m.media_type);
        }

        if (newEntry) {
            await db.from('movies').update({ rt_score: newEntry }).eq('id', m.id);
            m.rt_score = newEntry;
        }
        await new Promise(r => setTimeout(r, 300));
    }
    ind.remove();
    renderMovies();
    toast('RT links updated ✓', 'success');
}

let nowPlayingCA = null;

async function getNowPlayingCA() {
    if (nowPlayingCA) return nowPlayingCA;
    try {
        const r = await fetch(`https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_KEY}&region=CA`);
        const d = await r.json();
        nowPlayingCA = (d.results || []).map(m => m.id);
    } catch { nowPlayingCA = []; }
    return nowPlayingCA;
}

async function detectLocation(tmdbId) {
    try {
        const [detailRes, nowPlaying] = await Promise.all([
            fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${TMDB_KEY}`),
            getNowPlayingCA()
        ]);
        const detail = await detailRes.json();

        const releaseDate = detail.release_date ? new Date(detail.release_date) : null;
        const isReleased  = detail.status === 'Released' && releaseDate && releaseDate <= new Date();

        if (!isReleased) return 'upcoming';
        if (nowPlaying.includes(tmdbId)) return 'theater';
        return 'streaming';
    } catch { return 'streaming'; }
}

async function refreshLocations(list) {
    for (const m of list) {
        const loc = await detectLocation(m.tmdb_id);
        await db.from('movies').update({ location: loc }).eq('id', m.id);
        m.location = loc;
        await new Promise(r => setTimeout(r, 250)); // small delay to avoid rate limiting
    }
    renderMovies(); // re-render once all done
}

function onSearchInput() {
    clearTimeout(searchTimer);
    const q = document.getElementById('searchInput').value.trim();
    if (!q) { document.getElementById('searchDropdown').style.display = 'none'; return; }
    searchTimer = setTimeout(async () => {

        const results = isTv ? await tmdbTvSearch(q) : await tmdbSearch(q);
        renderDropdown(results, isTv);
    }, 420);
}

function renderDropdown(results, isTv) {
    const dd = document.getElementById('searchDropdown');
    searchResults = results.slice(0, 8);

    if (!searchResults.length) {
        dd.innerHTML = '<div style="padding:18px;color:#555;text-align:center;font-size:0.88rem">No results found</div>';
        dd.style.display = 'block';
        return;
    }
    dd.innerHTML = searchResults.map((r, i) => {
        const title = isTv ? r.name : r.title;
        const date  = isTv ? r.first_air_date : r.release_date;
        const year  = date ? date.slice(0,4) : '';
        const src   = r.poster_path ? `${TMDB_IMG_BASE}${r.poster_path}` : '';
        return `
        <div class="result-item" onclick="selectResult(${i})">
            ${src
                ? `<img class="result-thumb" src="${src}" alt="">`
                : `<div class="result-thumb" style="display:flex;align-items:center;justify-content:center;font-size:1.4rem">${isTv ? '📺' : '🎬'}</div>`}
            <div class="result-info">
                <h4>${escHtml(title)}</h4>
                <p>${year || 'Unknown year'}</p>
            </div>
        </div>`;
    }).join('');
    dd.style.display = 'block';
}

async function selectResult(index) {
    const r = searchResults[index];
    if (!r) return;

    const isTv = currentTab === 'tvshows';
    document.getElementById('searchDropdown').style.display = 'none';
    document.getElementById('searchInput').value = '';

    const title = isTv ? r.name : r.title;
    const date  = isTv ? r.first_air_date : r.release_date;
    const year  = date ? date.slice(0,4) : null;

    const [trailerKey, location, rtScore] = await Promise.all([
        tmdbTrailer(r.id, isTv ? 'tv' : 'movie'),
        isTv ? Promise.resolve('any') : detectLocation(r.id),
        fetchRTScore(title, year, r.id, isTv ? 'tv' : 'movie')
    ]);

    const item = {
        tmdb_id:    r.id,
        title:      title,
        year:       year ? parseInt(year) : null,
        poster_path: r.poster_path || '',
        overview:   r.overview || '',
        trailer_key: trailerKey,
        media_type: isTv ? 'tv' : 'movie',
        location:   location,
        rt_score:   rtScore
    };

    if (!unlocked) { pendingMovie = item; openAuthModal(); return; }
    showAddModal(item);
}

// ─────────────────────────────────────────────
function renderMovies() {
    const films     = movies.filter(m => m.media_type !== 'tv');
    const tvs       = movies.filter(m => m.media_type === 'tv');
    const allWatched = movies.filter(m => m.watched);

    const allTowatch = films.filter(m => !m.watched);
    const towatch    = locationFilter === 'any'
        ? allTowatch
        : locationFilter === 'theater'
        ? allTowatch.filter(m => m.location === 'theater' || m.location === 'upcoming')
        : allTowatch.filter(m => m.location === locationFilter);
    const tvTowatch  = tvs.filter(m => !m.watched);

    document.getElementById('count-towatch').textContent       = `${towatch.length} movie${towatch.length !== 1 ? 's' : ''} to watch`;
    document.getElementById('count-tvshows-watch').textContent = `${tvTowatch.length} show${tvTowatch.length !== 1 ? 's' : ''} to watch`;
    document.getElementById('count-watched').textContent       = `${allWatched.length} title${allWatched.length !== 1 ? 's' : ''} watched`;

    renderGrid('grid-towatch', towatch);
    renderGrid('grid-tvshows-towatch', tvTowatch);
    renderWatchedByMonth(allWatched);
}

function renderWatchedByMonth(list) {
    const container = document.getElementById('grid-watched');
    if (!list.length) {
        container.innerHTML = `<div class="empty-state"><div class="ei">🎬</div><p>Nothing watched yet</p></div>`;
        return;
    }

    // Sort newest watched_at first
    const sorted = [...list].sort((a, b) => {
        const da = a.watched_at ? new Date(a.watched_at) : new Date(0);
        const db_ = b.watched_at ? new Date(b.watched_at) : new Date(0);
        return db_ - da;
    });

    // Group by "Month Year"
    const groups = {};
    sorted.forEach(m => {
        const d = m.watched_at ? new Date(m.watched_at) : null;
        const key = d
            ? d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
            : 'Unknown date';
        if (!groups[key]) groups[key] = [];
        groups[key].push(m);
    });

    container.innerHTML = Object.entries(groups).map(([month, items]) => `
        <div class="month-group">
            <div class="month-label">${month}</div>
            <div class="movie-grid">
                ${items.map(m => movieCardHTML(m)).join('')}
            </div>
        </div>
    `).join('');
}

function rtSlug(title) {
    return (title || '')
        .toLowerCase()
        .replace(/[''`]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .trim()
        .replace(/\s+/g, '_');
}

// rt_score format: "87%|slugYear|version|OMDb title"
//   slugYear =  0  → direct slug, no year  e.g. /m/mind_game
//   slugYear >  0  → direct slug with year e.g. /m/frankenstein_2025
//   slugYear = -1  → ambiguous title, use RT search URL (title+year)
//   OMDb title stored for accurate slug generation
function parseRT(rtScore) {
    if (!rtScore) return { score: null, rtYear: null, omdbTitle: null, useSearch: false };
    const parts = rtScore.split('|');
    if (parts.length === 1) return { score: parts[0], rtYear: null, omdbTitle: null, useSearch: false };
    const yr = parseInt(parts[1]);
    const omdbTitle = parts.length > 3 ? parts.slice(3).join('|') : null;
    return { score: parts[0], rtYear: yr > 0 ? yr : null, omdbTitle, useSearch: yr === -1 };
}

function rtUrl(rtScore, title, year, mediaType) {
    const { rtYear, omdbTitle, useSearch } = parseRT(rtScore);
    if (useSearch) {
        const q = encodeURIComponent(year ? `${omdbTitle || title} ${year}` : (omdbTitle || title));
        return `https://www.rottentomatoes.com/search?search=${q}`;
    }
    const slug   = rtSlug(omdbTitle || title);
    const prefix = mediaType === 'tv' ? 'tv' : 'm';
    return rtYear
        ? `https://www.rottentomatoes.com/${prefix}/${slug}_${rtYear}`
        : `https://www.rottentomatoes.com/${prefix}/${slug}`;
}

function rtBadgeHTML(rtScore, title, year, mediaType) {
    if (!rtScore) return '';
    const { score } = parseRT(rtScore);
    const pct   = parseInt(score);
    const fresh = pct >= 60;
    const url   = rtUrl(rtScore, title, year, mediaType);
    return `<a class="rt-badge ${fresh ? 'rt-fresh' : 'rt-rotten'}" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="View on Rotten Tomatoes">${fresh ? '🍅' : '🤢'} ${score}</a>`;
}

function rtDetailHTML(rtScore, title, year, mediaType) {
    if (!rtScore) return '';
    const { score, useSearch } = parseRT(rtScore);
    const pct   = parseInt(score);
    const fresh = pct >= 60;
    const url   = rtUrl(rtScore, title, year, mediaType);
    return `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
            <a class="rt-badge ${fresh ? 'rt-fresh' : 'rt-rotten'}" href="${url}" target="_blank" rel="noopener" title="${useSearch ? 'Search on Rotten Tomatoes' : 'View on Rotten Tomatoes'}">${fresh ? '🍅' : '🤢'} ${score}</a>
            <span style="font-size:0.78rem;color:#555">${useSearch ? 'Rotten Tomatoes (tap to search)' : 'Rotten Tomatoes'}</span>
        </div>`;
}

function movieCardHTML(m) {
    const src = m.poster_path ? `${TMDB_IMG_BASE}${m.poster_path}` : '';
    const hi  = m.id === highlightId ? 'highlight-card' : '';
    const watchedDay = m.watched && m.watched_at
        ? new Date(m.watched_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
        : '';
    return `
    <div class="movie-card ${hi}" onclick="openDetail('${m.id}')">
        <div class="poster-wrapper">
            ${src
                ? `<img class="movie-poster" src="${src}" alt="${escHtml(m.title)}" loading="lazy">`
                : `<div class="poster-placeholder">🎬</div>`}
            ${m.watched ? '<div class="watched-badge">✓</div>' : ''}
            ${!m.watched && m.location === 'upcoming'  ? '<div class="loc-badge" style="background:rgba(234,179,8,0.85);color:#000">Soon</div>' : ''}
            <div class="card-overlay">
                <button class="ov-btn" onclick="event.stopPropagation();openDetail('${m.id}')">Info</button>
                ${unlocked ? `<button class="ov-btn green" onclick="event.stopPropagation();toggleWatched('${m.id}')">${m.watched ? 'Unwatch' : 'Watched'}</button>` : ''}
                ${unlocked ? `<button class="ov-btn red" onclick="event.stopPropagation();removeMovie('${m.id}')">🗑</button>` : ''}
            </div>
        </div>
        <div class="movie-info">
            <div class="movie-title" title="${escHtml(m.title)}">${escHtml(m.title)}</div>
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <div class="movie-year">${m.year || ''}</div>
                ${rtBadgeHTML(m.rt_score, m.title, m.year, m.media_type)}
            </div>
        </div>
    </div>`;
}

function renderGrid(gridId, list) {
    const grid = document.getElementById(gridId);
    if (!list.length) {
        grid.innerHTML = `<div class="empty-state"><div class="ei">🎬</div><p>Nothing here yet</p></div>`;
        return;
    }
    grid.innerHTML = list.map(m => movieCardHTML(m)).join('');
}

// ─────────────────────────────────────────────
// DETAIL MODAL
// ─────────────────────────────────────────────
function openDetail(id) {
    const m = movies.find(x => x.id === id);
    if (!m) return;

    const src = m.poster_path ? `${TMDB_IMG_BASE}${m.poster_path}` : '';

    document.getElementById('detailBody').innerHTML = `
        <div class="detail-body">
            <div class="detail-poster-wrap">
                ${src
                    ? `<img src="${src}" alt="${escHtml(m.title)}">`
                    : `<div class="no-poster">🎬</div>`}
            </div>
            <div class="detail-info">
                <div class="detail-title">${escHtml(m.title)}</div>
                <div class="detail-year">${m.year || 'Unknown year'}${m.location === 'upcoming' ? ' &nbsp;·&nbsp; <span style="color:#eab308;font-size:0.82rem">⏳ Coming Soon</span>' : ''}${m.watched && m.watched_at ? ` &nbsp;·&nbsp; <span style="color:#4CAF50;font-size:0.82rem">Watched ${new Date(m.watched_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</span>` : ''}</div>
                ${m.rt_score ? rtDetailHTML(m.rt_score, m.title, m.year, m.media_type) : ''}
                <div id="watchProviders" style="display:none"></div>
                <div class="detail-overview">${escHtml(m.overview || 'No description available.')}</div>
                <div class="detail-actions">
                    ${m.trailer_key
                        ? `<button class="btn btn-red" onclick="playTrailer('${m.trailer_key}')">▶ Trailer</button>`
                        : `<button class="btn btn-gray" id="findTrailerBtn" onclick="findTrailer(${m.tmdb_id},'${m.id}')">Find Trailer</button>`}
                    ${unlocked ? `
                        <button class="btn btn-gray" onclick="toggleWatched('${m.id}');closeDetail()">
                            ${m.watched ? '↩ Unwatch' : '✓ Mark Watched'}
                        </button>
                        <button class="btn btn-outline" onclick="removeMovie('${m.id}')">🗑 Delete</button>
                    ` : `<button class="btn btn-gray" onclick="closeDetail();handleLockClick()" style="opacity:0.7">🔒 Unlock to manage</button>`}
                </div>
            </div>
        </div>`;

    document.getElementById('trailerSlot').innerHTML = '';
    document.getElementById('detailModal').style.display = 'flex';

    // Load streaming providers asynchronously
    fetchWatchProviders(m.tmdb_id, m.media_type).then(providers => {
        const el = document.getElementById('watchProviders');
        if (!el) return;
        const flatrate = providers?.flatrate || [];
        const free     = providers?.free     || [];
        const allStream = [...flatrate, ...free];
        if (!allStream.length) return;
        el.innerHTML = `
            <div class="streaming-section">
                <div class="streaming-label">Where to Watch</div>
                <div class="streaming-providers">
                    ${allStream.map(p => `
                        <div class="provider-chip">
                            <img src="https://image.tmdb.org/t/p/w45${p.logo_path}" alt="${escHtml(p.provider_name)}">
                            <span>${escHtml(p.provider_name)}</span>
                        </div>`).join('')}
                </div>
            </div>`;
        el.style.display = 'block';
    });
}

async function fetchWatchProviders(tmdbId, mediaType) {
    try {
        const type = mediaType === 'tv' ? 'tv' : 'movie';
        const r = await fetch(`https://api.themoviedb.org/3/${type}/${tmdbId}/watch/providers?api_key=${TMDB_KEY}`);
        const d = await r.json();
        return d.results?.CA || null; // Canada
    } catch { return null; }
}

function playTrailer(key) {
    document.getElementById('trailerSlot').innerHTML = `
        <div class="trailer-wrap">
            <iframe src="https://www.youtube.com/embed/${key}?autoplay=1" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>`;
}

async function findTrailer(tmdbId, movieId) {
    const btn = document.getElementById('findTrailerBtn');
    if (btn) { btn.textContent = 'Searching…'; btn.disabled = true; }
    const m = movies.find(x => x.id === movieId);
    const key = await tmdbTrailer(tmdbId, m?.media_type);
    if (key) {
        await db.from('movies').update({ trailer_key: key }).eq('id', movieId);
        if (m) m.trailer_key = key;
        playTrailer(key);
    } else {
        if (btn) { btn.textContent = 'No trailer found'; }
    }
}

function closeDetail() {
    document.getElementById('detailModal').style.display = 'none';
    document.getElementById('trailerSlot').innerHTML = '';
}

function handleDetailBg(e) {
    if (e.target === document.getElementById('detailModal')) closeDetail();
}

// ─────────────────────────────────────────────
// RANDOM PICK
// ─────────────────────────────────────────────
function setLocationFilter(loc) {
    locationFilter = loc;
    ['any','streaming','theater'].forEach(l => {
        document.getElementById(`pill-${l}`)?.classList.toggle('active', l === loc);
    });
    renderMovies();
}

function pickRandom(type) {
    let pool = movies.filter(m => !m.watched && (type === 'tv' ? m.media_type === 'tv' : m.media_type !== 'tv'));
    if (type === 'movie' && locationFilter !== 'any') {
        pool = locationFilter === 'theater'
            ? pool.filter(m => m.location === 'theater' || m.location === 'upcoming')
            : pool.filter(m => m.location === locationFilter);
    }
    const label = type === 'tv' ? 'shows' : 'movies';
    if (!pool.length) { toast(`No ${label} match the current filter!`, 'error'); return; }

    const pick = pool[Math.floor(Math.random() * pool.length)];
    highlightId = pick.id;
    renderMovies();

    setTimeout(() => {
        document.querySelector('.highlight-card')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        openDetail(pick.id);
    }, 250);

    setTimeout(() => { highlightId = null; renderMovies(); }, 6000);
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function escHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function esc(s) {
    return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function toast(msg, type) {
    document.querySelector('.toast')?.remove();
    const el = Object.assign(document.createElement('div'), { className: `toast toast-${type}`, textContent: msg });
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
}

// Close search on outside click
document.addEventListener('click', e => {
    if (!e.target.closest('.search-section'))
        document.getElementById('searchDropdown').style.display = 'none';
});

// Swipe between tabs on mobile
const TAB_ORDER = ['towatch', 'tvshows', 'watched'];
let swipeStartX = 0;

document.addEventListener('touchstart', e => {
    swipeStartX = e.touches[0].clientX;
}, { passive: true });

document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - swipeStartX;
    if (Math.abs(dx) < 50) return; // too short
    const idx = TAB_ORDER.indexOf(currentTab);
    if (dx < 0 && idx < TAB_ORDER.length - 1) switchTab(TAB_ORDER[idx + 1]); // swipe left → next
    if (dx > 0 && idx > 0) switchTab(TAB_ORDER[idx - 1]);                     // swipe right → prev
}, { passive: true });

// ─────────────────────────────────────────────
// START
// ─────────────────────────────────────────────
init();
</script>
